name: CI

on:
  # CI roda em QUALQUER branch (push ou PR). O deploy é separado e só
  # dispara na main (ver deploy-oci.yml).
  push:
  pull_request:

jobs:
  lua-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1 + LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks libssl-dev

      - name: Install SQLite 3.45+ from source
        run: |
          wget -q https://sqlite.org/2024/sqlite-autoconf-3450000.tar.gz
          tar xzf sqlite-autoconf-3450000.tar.gz
          cd sqlite-autoconf-3450000
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          cd ..
          rm -rf sqlite-autoconf-*

      - name: Install Lua dependencies
        run: |
          sudo luarocks install luasocket
          sudo luarocks install copas
          sudo luarocks install lsqlite3 SQLITE_DIR=/usr/local
          sudo luarocks install lua-cjson
          sudo luarocks install luaexpat
          sudo luarocks install lua-csv
          sudo luarocks install dkjson
          sudo luarocks install busted

      - name: Run Lua tests
        working-directory: ./backend-lua
        run: busted --verbose tests/*.lua

      - name: Validate Lua syntax
        run: |
          for f in $(find backend-lua -name '*.lua' -not -path '*/tests/*'); do
            luac -p "$f" || { echo "FAIL: $f"; exit 1; }
          done

  shell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          for f in backup.sh stop.sh \
                   scripts/dev/setup-local.sh \
                   scripts/dev/setup-lua.sh \
                   scripts/dev/run-lua.sh \
                   scripts/dev/run-c-frontend.sh \
                   scripts/dev/start-lua-stack.sh \
                   scripts/deploy/generate-secrets.sh \
                   scripts/deploy/deploy-local.sh \
                   scripts/deploy/deploy-nginx.sh \
                   scripts/dev/verify-gzip.sh; do
            # Fail on real syntax errors; a missing (optional) file is OK.
            if [ -f "$f" ]; then sh -n "$f" || exit 1; else echo "skip $f (not found)"; fi
          done
          # bash-only scripts (arrays, [[ ]]) — must use bash -n
          for f in scripts/dev/stop-lua-stack.sh \
                   scripts/dev/kill-rogue-yvy.sh \
                   scripts/backup/prod-backup.sh \
                   scripts/backup/pull-prod-backups.sh \
                   scripts/backup/install-backup-cron.sh \
                   scripts/backup/install-ingestion-cron.sh \
                   scripts/data/check_prodes_update.sh \
                   scripts/data/deter_daily.sh \
                   scripts/data/download_embargo.sh \
                   scripts/data/mapbiomas_weekly.sh \
                   scripts/data/car_weekly.sh \
                   scripts/data/area_efetiva_weekly.sh \
                   scripts/data/status_marker.sh \
                   scripts/dev/setup-python-env.sh \
                   scripts/deploy/sync-sinaflor.sh; do
            if [ -f "$f" ]; then bash -n "$f" || exit 1; else echo "skip $f (not found)"; fi
          done

      - name: Lint shell scripts (shellcheck)
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning \
            backup.sh stop.sh \
            scripts/dev/setup-local.sh scripts/dev/setup-lua.sh \
            scripts/dev/run-lua.sh scripts/dev/run-c-frontend.sh \
            scripts/dev/start-lua-stack.sh scripts/dev/stop-lua-stack.sh \
            scripts/dev/kill-rogue-yvy.sh scripts/deploy/generate-secrets.sh \
            scripts/deploy/deploy-local.sh scripts/deploy/deploy-nginx.sh \
            scripts/dev/verify-gzip.sh \
            scripts/backup/prod-backup.sh scripts/backup/pull-prod-backups.sh \
            scripts/backup/install-backup-cron.sh scripts/backup/install-ingestion-cron.sh \
            scripts/data/check_prodes_update.sh scripts/data/deter_daily.sh \
            scripts/data/download_embargo.sh scripts/data/mapbiomas_weekly.sh \
            scripts/data/car_weekly.sh scripts/data/area_efetiva_weekly.sh \
            scripts/data/status_marker.sh \
            scripts/dev/setup-python-env.sh scripts/deploy/sync-sinaflor.sh \
          || true

      - name: Guard nginx gzip config (template)
        run: |
          bash scripts/dev/verify-gzip.sh

      - name: Validate Ansible playbook syntax
        run: |
          pip install ansible
          printf '[yvy]\n127.0.0.1 ansible_user=ubuntu ansible_connection=local\n' \
            > /tmp/ci-inventory.ini
          ansible-playbook --syntax-check \
            -i /tmp/ci-inventory.ini \
            ansible/playbook.yml
          echo "Ansible syntax OK"

  python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # py_compile only checks syntax (no imports run), so no deps are needed.
      # New TerraBrasilis batch scripts must compile before they can run.
      - name: Validate Python syntax
        run: |
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          find scripts -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          CI: true
          DISABLE_ESLINT_PLUGIN: true
