# Yvy nginx config — HTTPS with HTTP redirect
# Cert: Let's Encrypt via certbot. Use webroot authenticator:
#   sudo certbot certonly --webroot -w /var/www/certbot -d yvy.app.br
# Note: www.yvy.app.br has NO DNS record — do NOT include it.

# HTTP → HTTPS redirect + ACME challenges
server {
    listen 80;
    server_name yvy.app.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name yvy.app.br _;
    root /opt/yvy/frontend/build;
    index index.html;

    # SSL certificates (managed by certbot)
    # NOTE: lineage is yvy.app.br-0001 because the original yvy.app.br lineage
    # had a broken www domain. If a fresh cert is issued, re-check with
    # `certbot certificates` and update this path.
    ssl_certificate /etc/letsencrypt/live/yvy.app.br-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yvy.app.br-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API requests → Lua backend directly (bypass C server to avoid 502 race)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-API-Key injected server-side so the browser never sees the secret.
        # NOTE: this static file is a reference only (the playbook deploys
        # ansible/templates/yvy-nginx.conf.j2). Replace the placeholder with
        # the real API_KEY value before using this config anywhere.
        proxy_set_header X-API-Key "CHANGE_ME_REPLACE_WITH_REAL_API_KEY";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}