# nginx.conf — Yvy backend (OpenResty + LuaJIT)
# Single config: API routes in Lua, static files from React build

worker_processes auto;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    # ── Lua configuration ────────────────────────────────────────────────
    lua_package_path "/opt/yvy/backend-lua/?.lua;/opt/yvy/backend-lua/?/init.lua;;";
    lua_package_cpath "/usr/local/lib/lua/5.1/?.so;;";

    # Shared dictionaries for caching / rate limiting
    lua_shared_dict rate_limit_dict 10m;
    lua_shared_dict cache_dict 20m;

    # ── Basic settings ───────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml;

    # ── Logging ──────────────────────────────────────────────────────────
    log_format json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"level":"INFO",'
        '"event":"http_request",'
        '"path":"$uri",'
        '"status_code":$status,'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"duration_ms":$request_time,'
        '"bytes":$body_bytes_sent'
        '}';

    access_log /dev/stdout json;
    error_log /dev/stderr info;

    server {
        listen 80;
        server_name _;

        # ── Security headers ────────────────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), bluetooth=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline' https://stackpath.bootstrapcdn.com https://cdn.jsdelivr.net https://unpkg.com; script-src 'self' 'unsafe-inline' https://code.jquery.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' https://stackpath.bootstrapcdn.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # ── CORS ────────────────────────────────────────────────────────
        set $cors_origin "";
        set $cors_methods "GET, POST, OPTIONS";
        set $cors_headers "Content-Type, Authorization, X-API-Key";

        # Handle OPTIONS preflight
        location /api/ {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "$http_origin" always;
                add_header Access-Control-Allow-Methods "$cors_methods" always;
                add_header Access-Control-Allow-Headers "$cors_headers" always;
                add_header Access-Control-Max-Age 86400;
                return 204;
            }
        }

        # ── Health check ────────────────────────────────────────────────
        location = /health {
            default_type application/json;
            return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
        }

        location = /api/health {
            default_type application/json;
            return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
        }

        # ── API routes ──────────────────────────────────────────────────

        # GET /api/fires
        location = /api/fires {
            default_type application/json;
            content_by_lua_block {
                local fires = require("app.fires")
                fires.get_fires()
            }
        }

        # POST /api/fires/sync
        location = /api/fires/sync {
            default_type application/json;
            content_by_lua_block {
                local fires = require("app.fires")
                fires.sync_fires()
            }
        }

        # POST /api/admin/firms/sync
        location = /api/admin/firms/sync {
            default_type application/json;
            content_by_lua_block {
                local fires = require("app.fires")
                fires.admin_firms_sync()
            }
        }

        # GET /api/data
        location = /api/data {
            default_type application/json;
            content_by_lua_block {
                local def = require("app.deforestation")
                def.get_data()
            }
        }

        # GET /api/biomes
        location = /api/biomes {
            default_type application/json;
            content_by_lua_block {
                local biomes = require("app.biomes")
                biomes.get_biomes()
            }
        }

        # GET /api/alerts
        location = /api/alerts {
            default_type application/json;
            content_by_lua_block {
                local auth = require("app.auth")
                local rl = require("app.rate_limit")
                local redis = require("app.redis")
                local db = require("app.db")
                local alerts_mod = require("app.alerts")
                local http = require("resty.http")
                local cjson = require("cjson")

                auth.enforce()
                rl.enforce()

                local cached = redis.get("alerts:all")
                if cached then
                    ngx.say(cached)
                    return
                end

                local fires = db.find_fires(-34.0, 5.5, -74.0, -34.0, 10000)
                local httpc = http.new()
                httpc:set_timeout(30000)
                local result = alerts_mod.generate_all_alerts(fires, httpc, os.getenv("WAQI_TOKEN"))
                httpc:close()

                local body = cjson.encode(result)
                redis.set("alerts:all", body, 1800)
                ngx.say(body)
            }
        }

        # GET /api/news
        location = /api/news {
            default_type application/json;
            content_by_lua_block {
                local news = require("app.news")
                news.get_news()
            }
        }

        # POST /api/news/refresh
        location = /api/news/refresh {
            default_type application/json;
            content_by_lua_block {
                local news = require("app.news")
                news.refresh_news()
            }
        }

        # POST /api/news/repair
        location = /api/news/repair {
            default_type application/json;
            content_by_lua_block {
                local news = require("app.news")
                news.repair_news()
            }
        }

        # POST /api/admin/news/sync
        location = /api/admin/news/sync {
            default_type application/json;
            content_by_lua_block {
                local news = require("app.news")
                news.admin_news_sync()
            }
        }

        # GET /api/weather/air-quality
        location = /api/weather/air-quality {
            default_type application/json;
            content_by_lua_block {
                local weather = require("app.weather")
                weather.get_air_quality()
            }
        }

        # GET /api/weather/temperature
        location = /api/weather/temperature {
            default_type application/json;
            content_by_lua_block {
                local weather = require("app.weather")
                weather.get_temperature()
            }
        }

        # GET /api/indigenous-lands
        location = /api/indigenous-lands {
            default_type application/json;
            content_by_lua_block {
                local rl = require("app.rate_limit")
                rl.enforce()
                -- Serve pre-loaded JSON
                local f = io.open("/opt/yvy/backend-lua/data/indigenous_lands.json", "r")
                if f then
                    ngx.say(f:read("*a"))
                    f:close()
                else
                    ngx.say("{}")
                end
            }
        }

        # GET /api/conservation-units
        location = /api/conservation-units {
            default_type application/json;
            content_by_lua_block {
                local rl = require("app.rate_limit")
                rl.enforce()
                local f = io.open("/opt/yvy/backend-lua/data/conservation_units.json", "r")
                if f then
                    ngx.say(f:read("*a"))
                    f:close()
                else
                    ngx.say("{}")
                end
            }
        }

        # GET /api/stats
        location = /api/stats {
            default_type application/json;
            content_by_lua_block {
                local auth = require("app.auth")
                local rl = require("app.rate_limit")
                local db = require("app.db")
                local cjson = require("cjson")

                auth.enforce()
                rl.enforce()

                local stats = db.get_stats()
                ngx.say(cjson.encode(stats))
            }
        }

        # ── Root / ──────────────────────────────────────────────────────
        location = / {
            default_type application/json;
            return 200 '{"message":"API do backend de desmatamento (Lua/OpenResty)"}';
        }

        # ── Static files (React build) ──────────────────────────────────
        location / {
            root /opt/yvy/frontend/build;
            try_files $uri /index.html;
        }

        # ── Error pages ─────────────────────────────────────────────────
        error_page 404 /api/404;
        location = /api/404 {
            default_type application/json;
            return 404 '{"error":"Not found"}';
        }

        error_page 500 502 503 504 /api/50x;
        location = /api/50x {
            default_type application/json;
            return 500 '{"error":"Internal server error"}';
        }
    }

    # ── Init phase (runs once per worker) ───────────────────────────────
    init_by_lua_block {
        -- Load .env file if present
        local function load_dotenv(path)
            local f = io.open(path, "r")
            if not f then return end
            for line in f:lines() do
                line = line:gmatch("^%s*(.-)%s*$")()
                if line ~= "" and not line:match("^#") then
                    local key, value = line:match("^([%w_]+)%s*=%s*(.*)$")
                    if key then
                        value = value:gsub('^"', ""):gsub('"$', ""):gsub("^'", ""):gsub("'$", "")
                        value = value:match("^(.-)%s*#") or value
                        os.setenv(key, value)
                    end
                end
            end
            f:close()
        end

        load_dotenv("/opt/yvy/.env")
        load_dotenv(".env")
    }

    init_worker_by_lua_block {
        local init = require("app.init")
        init.startup()
        init.start_background_tasks()
    }
}
