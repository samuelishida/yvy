# render.yaml — Render deployment configuration for Yvy (Lua/OpenResty)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: yvy
    env: docker
    dockerfilePath: ./backend-lua/Dockerfile
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        sync: false
        generateValue: true
      - key: AUTH_REQUIRED
        value: "1"
      - key: FIRMS_MAP_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: WAQI_TOKEN
        sync: false
      - key: REDIS_URL
        fromService:
          name: yvy-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://yvy.app.br,https://yvy.onrender.com,http://localhost:5001,http://127.0.0.1:5001"
      - key: LOG_LEVEL
        value: "INFO"
      - key: SQLITE_PATH
        value: "/opt/yvy/data/yvy.db"
      - key: FIRMS_SOURCE
        value: "VIIRS_SNPP_NRT"
      - key: FIRMS_DAY_RANGE
        value: "3"
      - key: FIRMS_SYNC_INTERVAL_HOURS
        value: "4"
      - key: NEWS_SYNC_INTERVAL_MINUTES
        value: "15"
      - key: MAX_RESULTS_PER_REQUEST
        value: "10000"
      - key: RATE_LIMIT_REQUESTS
        value: "60"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
    disk:
      name: sqlite-data
      mountPath: /opt/yvy/data
      sizeGB: 10

  - type: redis
    name: yvy-redis
    plan: free
    ipAllowList: []
