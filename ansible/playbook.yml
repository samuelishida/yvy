---
# Yvy deploy playbook (OCI baremetal, hybrid arch)
#
# Architecture:
#   Browser :443 (HTTPS)
#     └─ nginx (TLS termination + reverse proxy)
#         └─ C frontend server :5001  (backend-lua/yvy-server)
#             ├─ Static React build /opt/yvy/frontend/build
#             └─ Proxies /api/* → Lua backend :5000 (X-API-Key injection)
#                 └─ Lua backend :5000  (backend-lua/main.lua)
#                     ├─ SQLite /opt/yvy/backend-lua/data/yvy.db
#                     └─ Redis localhost:6379
#
# Build steps (CI on the VM):
#   1. apt deps (lua, gcc, nginx, certbot, redis, sqlite, ...)
#   2. nvm + node (only used for `npm run build`)
#   3. setup-lua.sh (LuaRocks deps)
#   4. SQLite migration (block/rescue)
#   5. npm ci + npm run build → frontend/build
#   6. make in backend-lua → C binary yvy-server
#   7. systemd: yvy-backend (Lua), yvy-frontend (C server)
#   8. nginx config + Let's Encrypt cert
#
# Health gates: backend :5000/health, frontend :5001/, public https://{{ domain }}/

- name: Deploy Yvy na OCI
  hosts: yvy
  become: true
  vars:
    app_dir: /opt/yvy
    repo_url: https://github.com/samuelishida/yvy.git
    yvy_user: ubuntu
    yvy_group: ubuntu
    nvm_dir: "/home/{{ yvy_user }}/.nvm"
    node_version: "18"
    domain: "yvy.app.br"
    certbot_email: "samuel.ishida@gmail.com"
    sqlite_backup_dir: /var/backups/yvy
    sqlite_backup_path: /var/backups/yvy/yvy.db.predeploy
    yvy_install_test_deps: "0"
    purge_node_modules_after_build: true
    c_server_bin: "{{ app_dir }}/backend-lua/yvy-server"
    c_server_src: "{{ app_dir }}/backend-lua/yvy-server.c"
    static_build_dir: "{{ app_dir }}/frontend/build"
    # Playwright stealth scraper for blocked sources (Greenpeace, oc.eco.br, etc.)
    install_playwright: true
    run_backfill_after_deploy: true
    backfill_limit: "200"

  tasks:
    # ── 1. System packages ─────────────────────────────────────────────────
    - name: Instalar dependencias de runtime baremetal
      ansible.builtin.apt:
        update_cache: true
        name:
          - git
          - python3
          - python3-pip
          - python3-venv
          - build-essential
          - gcc
          - make
          - pkg-config
          - wget
          - unzip
          - ca-certificates
          - lua5.1
          - liblua5.1-0-dev
          - luarocks
          - libsqlite3-dev
          - libssl-dev
          - libexpat1-dev
          - redis-server
          - sqlite3
          - curl
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Garantir Redis ativo
      ansible.builtin.systemd:
        name: redis-server
        state: started
        enabled: true

    - name: Garantir swap para VM 1GB
      ansible.builtin.shell:
        cmd: |
          swapon --show | grep -q /swapfile || {
            fallocate -l 2G /swapfile &&
            chmod 600 /swapfile &&
            mkswap /swapfile &&
            swapon /swapfile &&
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          }
      changed_when: false

    - name: Criar diretorio para ACME challenges
      ansible.builtin.file:
        path: /var/www/certbot
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    # ── 2. Node (build-time only) ──────────────────────────────────────────
    - name: Verificar se nvm esta instalado
      ansible.builtin.stat:
        path: "{{ nvm_dir }}/nvm.sh"
      register: nvm_installed

    - name: Instalar nvm
      when: not nvm_installed.stat.exists
      ansible.builtin.shell:
        cmd: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
        args:
          creates: "{{ nvm_dir }}/nvm.sh"
      become_user: "{{ yvy_user }}"

    - name: Instalar Node {{ node_version }} via nvm
      ansible.builtin.shell:
        cmd: |
          export NVM_DIR="{{ nvm_dir }}"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          nvm install {{ node_version }}
          nvm alias default {{ node_version }}
        executable: /bin/bash
      become_user: "{{ yvy_user }}"
      register: node_install
      changed_when: "'already installed' not in node_install.stdout"

    # ── 3. App directory + service stop ────────────────────────────────────
    - name: Criar diretorio da aplicacao
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ yvy_user }}"
        group: "{{ yvy_group }}"
        mode: '0755'

    - name: Corrigir ownership do diretorio da aplicacao
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ yvy_user }}"
        group: "{{ yvy_group }}"
        recurse: yes

    - name: Parar backend antes de preservar banco SQLite
      ansible.builtin.systemd:
        name: yvy-backend
        state: stopped
      ignore_errors: true

    - name: Parar frontend antes do checkout
      ansible.builtin.systemd:
        name: yvy-frontend
        state: stopped
      ignore_errors: true

    # ── 4. SQLite backup before checkout ───────────────────────────────────
    - name: Verificar banco SQLite existente antes do git checkout
      ansible.builtin.stat:
        path: "{{ app_dir }}/backend-lua/data/yvy.db"
      register: existing_sqlite_db

    - name: Criar diretorio de backup SQLite
      ansible.builtin.file:
        path: "{{ sqlite_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Checkpoint WAL do SQLite existente antes do backup
      when: existing_sqlite_db.stat.exists
      ansible.builtin.command:
        cmd: sqlite3 {{ app_dir }}/backend-lua/data/yvy.db "PRAGMA wal_checkpoint(TRUNCATE);"
      become_user: "{{ yvy_user }}"

    - name: Preservar banco SQLite existente antes do git checkout
      when: existing_sqlite_db.stat.exists
      ansible.builtin.copy:
        src: "{{ app_dir }}/backend-lua/data/yvy.db"
        dest: "{{ sqlite_backup_path }}"
        remote_src: true
        owner: "{{ yvy_user }}"
        group: "{{ yvy_group }}"
        mode: '0644'

    # ── 5. Source checkout ─────────────────────────────────────────────────
    - name: Clonar repositório Yvy
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes
      become_user: "{{ yvy_user }}"

    - name: Garantir diretorio de dados do backend Lua
      ansible.builtin.file:
        path: "{{ app_dir }}/backend-lua/data"
        state: directory
        owner: "{{ yvy_user }}"
        group: "{{ yvy_group }}"
        mode: '0755'

    - name: Restaurar banco SQLite preservado apos git checkout
      when: existing_sqlite_db.stat.exists
      ansible.builtin.copy:
        src: "{{ sqlite_backup_path }}"
        dest: "{{ app_dir }}/backend-lua/data/yvy.db"
        remote_src: true
        owner: "{{ yvy_user }}"
        group: "{{ yvy_group }}"
        mode: '0644'

    # ── 6. .env + secrets ──────────────────────────────────────────────────
    - name: Gerar secrets se .env não existir
      ansible.builtin.command:
        cmd: bash scripts/generate-secrets.sh
        chdir: "{{ app_dir }}"
      become_user: "{{ yvy_user }}"
      args:
        creates: "{{ app_dir }}/.env"

    - name: Configurar CORS_ORIGINS no .env
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^CORS_ORIGINS=.*"
        line: "CORS_ORIGINS=https://{{ domain }},http://{{ ansible_host }}:5001,http://localhost:5001"
        create: true
      become_user: "{{ yvy_user }}"

    # ── 7. Lua dependencies + migration ────────────────────────────────────
    - name: Rodar setup Lua
      ansible.builtin.command:
        cmd: bash scripts/setup-lua.sh
        chdir: "{{ app_dir }}"
      environment:
        YVY_INSTALL_TEST_DEPS: "{{ yvy_install_test_deps }}"
      become_user: "{{ yvy_user }}"
      async: 3600
      poll: 15

    - block:
        - name: Migrar SQLite JSONB explicitamente
          ansible.builtin.command:
            cmd: lua5.1 app/migrate.lua
            chdir: "{{ app_dir }}/backend-lua"
          environment:
            SQLITE_PATH: "{{ app_dir }}/backend-lua/data/yvy.db"
          become_user: "{{ yvy_user }}"
          async: 5400
          poll: 10

        - name: Validar migracao SQLite JSONB e ingerir lookups
          ansible.builtin.shell:
            cmd: |
              cd {{ app_dir }}/backend-lua
              SQLITE_PATH={{ app_dir }}/backend-lua/data/yvy.db lua5.1 -e 'package.path="./?.lua;./?/init.lua;"..package.path; require("app.env"); local db=require("app.db"); db.init_db(); require("app.lookups.biome_lookup").load_biomes(); require("app.lookups.indigenous_lands_lookup").load_indigenous_lands(); require("app.lookups.conservation_units_lookup").load_conservation_units(); db.optimize_db(); print("sqlite jsonb migration ok")'
            executable: /bin/bash
          become_user: "{{ yvy_user }}"

      rescue:
        - name: Restaurar banco SQLite preservado apos falha de migracao
          when: existing_sqlite_db.stat.exists
          ansible.builtin.copy:
            src: "{{ sqlite_backup_path }}"
            dest: "{{ app_dir }}/backend-lua/data/yvy.db"
            remote_src: true
            owner: "{{ yvy_user }}"
            group: "{{ yvy_group }}"
            mode: '0644'

        - name: Abortar deploy apos falha de migracao SQLite
          ansible.builtin.fail:
            msg: "Migração JSONB falhou; o backup SQLite foi restaurado."

    # ── 8. Frontend build (React static via npm) ───────────────────────────
    - name: Instalar dependencias frontend (build-time)
      ansible.builtin.shell:
        cmd: |
          export NVM_DIR="{{ nvm_dir }}"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          cd {{ app_dir }}/frontend
          npm ci
        executable: /bin/bash
      become_user: "{{ yvy_user }}"

    - name: Build frontend (produzir static build/)
      ansible.builtin.shell:
        cmd: |
          export NVM_DIR="{{ nvm_dir }}"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          cd {{ app_dir }}/frontend
          npm run build
        executable: /bin/bash
      become_user: "{{ yvy_user }}"

    - name: Verificar build do frontend gerado
      ansible.builtin.stat:
        path: "{{ static_build_dir }}/index.html"
      register: build_check
      failed_when: not build_check.stat.exists

    # Free RAM/disk on 1GB VM — node_modules not needed at runtime, only at build.
    - name: Purgar node_modules apos build (liberar disco/RAM)
      when: purge_node_modules_after_build | bool
      ansible.builtin.file:
        path: "{{ app_dir }}/frontend/node_modules"
        state: absent

    # ── 9. Compile C frontend server ───────────────────────────────────────
    - name: Compilar yvy-server (C frontend)
      ansible.builtin.command:
        cmd: make
        chdir: "{{ app_dir }}/backend-lua"
      become_user: "{{ yvy_user }}"
      register: c_build

    - name: Verificar binario yvy-server existe e e executavel
      ansible.builtin.stat:
        path: "{{ c_server_bin }}"
      register: bin_check
      failed_when: (not bin_check.stat.exists) or (not bin_check.stat.executable)

    # ── 10. systemd units ──────────────────────────────────────────────────
    - name: Obter caminho do Node bin (para PATH em systemd, opcional)
      ansible.builtin.shell:
        cmd: |
          export NVM_DIR="{{ nvm_dir }}"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          which node
        executable: /bin/bash
      become_user: "{{ yvy_user }}"
      register: node_path_result
      changed_when: false

    - name: Criar unidade systemd do backend (Lua)
      ansible.builtin.template:
        src: yvy-backend.service.j2
        dest: /etc/systemd/system/yvy-backend.service
        owner: root
        group: root
        mode: '0644'

    - name: Criar unidade systemd do frontend (C server)
      ansible.builtin.template:
        src: yvy-frontend.service.j2
        dest: /etc/systemd/system/yvy-frontend.service
        owner: root
        group: root
        mode: '0644'

    - name: Recarregar systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Ativar e iniciar backend Lua
      ansible.builtin.systemd:
        name: yvy-backend
        state: restarted
        enabled: true

    - name: Aguardar backend ficar saudável
      ansible.builtin.uri:
        url: http://localhost:5000/health
        status_code: 200
      register: backend_health
      until: backend_health.status == 200
      retries: 30
      delay: 5

    - name: Ativar e iniciar frontend (C server)
      ansible.builtin.systemd:
        name: yvy-frontend
        state: restarted
        enabled: true

    - block:
        - name: Aguardar frontend C server ficar saudável
          ansible.builtin.uri:
            url: http://localhost:5001/
            status_code: 200
          register: frontend_health
          until: frontend_health.status == 200
          retries: 30
          delay: 5
      rescue:
        - name: Coletar journal frontend (debug)
          ansible.builtin.command:
            cmd: journalctl -u yvy-frontend -n 100 --no-pager
          register: frontend_journal
          changed_when: false
          failed_when: false

        - name: Mostrar journal frontend
          ansible.builtin.debug:
            var: frontend_journal.stdout_lines

        - name: Falhar deploy apos health check do frontend
          ansible.builtin.fail:
            msg: "Frontend C server (yvy-server) health check on :5001 falhou; veja journal acima."

    # ── 11. nginx (TLS termination + reverse proxy → :5001) ────────────────
    - name: Obter API_KEY do .env (passado via systemd EnvironmentFile, nao mais nginx)
      ansible.builtin.shell:
        cmd: grep '^API_KEY=' {{ app_dir }}/.env | cut -d= -f2
      register: api_key_result
      changed_when: false
      no_log: true

    - name: Deploy nginx config (HTTPS → C server :5001)
      ansible.builtin.template:
        src: yvy-nginx.conf.j2
        dest: /etc/nginx/sites-available/yvy
        owner: root
        group: root
        mode: '0644'
      notify: reload nginx

    - name: Habilitar site nginx
      ansible.builtin.file:
        src: /etc/nginx/sites-available/yvy
        dest: /etc/nginx/sites-enabled/yvy
        state: link
      notify: reload nginx

    - name: Remover configs obsoletas do nginx
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/sites-enabled/default
        - /etc/nginx/sites-enabled/yvy-temp
        - /etc/nginx/sites-available/yvy-temp
        - /etc/nginx/sites-available/yvy-ssl
      notify: reload nginx

    - name: Verificar certificado SSL existe
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ domain }}/fullchain.pem
      register: ssl_cert

    - name: Solicitar certificado SSL Let's Encrypt (se nao existir)
      when: not ssl_cert.stat.exists
      ansible.builtin.shell:
        cmd: |
          certbot certonly --webroot \
            --webroot-path=/var/www/certbot \
            --email "{{ certbot_email }}" \
            --agree-tos \
            --no-eff-email \
            --non-interactive \
            -d "{{ domain }}" \
            -d "www.{{ domain }}"
      ignore_errors: true
      register: cert_result

    - name: Configurar renew automático do SSL
      ansible.builtin.copy:
        dest: /etc/cron.d/certbot-renew
        content: |
          0 3 1 * * root certbot renew --quiet --deploy-hook "systemctl reload nginx"
        owner: root
        group: root
        mode: '0644'

    # ── 12. Final user-facing health checks ────────────────────────────────
    - name: Recarregar nginx (force flush handlers antes da verificacao)
      ansible.builtin.meta: flush_handlers

    # ── 12.5. Playwright (venv) + stealth scrapers ────────────────────────
    # Install Playwright into a venv at /opt/yvy/.venv to dodge Ubuntu 24.04
    # PEP 668 (externally-managed). PYTHON env var is exported via systemd so
    # browser_fallback.lua picks up the venv interpreter.
    - name: Instalar Playwright em venv {{ app_dir }}/.venv
      when: install_playwright | bool
      ansible.builtin.pip:
        name:
          - playwright
        virtualenv: "{{ app_dir }}/.venv"
        virtualenv_command: python3 -m venv
      become_user: "{{ yvy_user }}"

    - name: Instalar browser Chromium do Playwright (no venv)
      when: install_playwright | bool
      ansible.builtin.command:
        cmd: "{{ app_dir }}/.venv/bin/python -m playwright install chromium"
      environment:
        PLAYWRIGHT_BROWSERS_PATH: "/home/{{ yvy_user }}/.cache/ms-playwright"
      become_user: "{{ yvy_user }}"
      register: pw_install
      changed_when: "'is already installed' not in pw_install.stdout"

    - name: Instalar deps de sistema do Chromium (apt libs)
      when: install_playwright | bool
      ansible.builtin.command:
        cmd: "{{ app_dir }}/.venv/bin/python -m playwright install-deps chromium"
      register: pw_deps
      changed_when: "'0 newly installed' not in pw_deps.stdout"
      failed_when: false

    - name: Backfill de imagens de noticias via Playwright
      when: run_backfill_after_deploy | bool
      ansible.builtin.command:
        cmd: "{{ app_dir }}/.venv/bin/python scripts/backfill_news_images_playwright.py --limit {{ backfill_limit }} --timeout 60"
        chdir: "{{ app_dir }}"
      environment:
        PLAYWRIGHT_BROWSERS_PATH: "/home/{{ yvy_user }}/.cache/ms-playwright"
      become_user: "{{ yvy_user }}"
      register: backfill_result
      async: 2400
      poll: 30
      changed_when: "'updated=' in backfill_result.stdout and 'updated=0 ' not in backfill_result.stdout"
      failed_when: false

    - name: Mostrar resultado do backfill
      when: run_backfill_after_deploy | bool and backfill_result.stdout is defined
      ansible.builtin.debug:
        msg: "{{ backfill_result.stdout_lines | default([]) }}"

    - name: Testar backend health (direto)
      ansible.builtin.uri:
        url: "http://localhost:5000/health"
        status_code: 200
      register: backend_final_health
      until: backend_final_health.status == 200
      retries: 5
      delay: 5

    - name: Testar frontend C server (direto)
      ansible.builtin.uri:
        url: "http://localhost:5001/"
        status_code: 200
      register: frontend_final_health
      until: frontend_final_health.status == 200
      retries: 5
      delay: 5

    - name: Testar site público via nginx HTTPS
      ansible.builtin.uri:
        url: "https://{{ domain }}/"
        status_code: 200
        validate_certs: false
      register: public_health
      until: public_health.status == 200
      retries: 5
      delay: 5

    - name: Mostrar URL de acesso
      ansible.builtin.debug:
        msg: |
          ✅ Yvy disponível em: https://{{ domain }}
          Backend health:    https://{{ domain }}/health
          API:               https://{{ domain }}/api/
          Local backend:     http://127.0.0.1:5000
          Local C frontend:  http://127.0.0.1:5001

  handlers:
    - name: reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
