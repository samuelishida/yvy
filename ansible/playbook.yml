---
- name: Deploy Yvy na OCI
  hosts: yvy
  become: true
  # No task uses ansible_facts; skipping fact gathering shaves seconds and
  # silences the Python interpreter-discovery warning on every run.
  gather_facts: false
  vars:
    app_dir: /opt/yvy
    repo_url: https://github.com/samuelishida/yvy.git
    yvy_user: ubuntu
    yvy_group: ubuntu
    nvm_dir: "/home/{{ yvy_user }}/.nvm"
    node_version: "18"
    domain: "yvy.app.br"
    certbot_email: "samuel.ishida@gmail.com"
    sqlite_backup_dir: /var/backups/yvy
    sqlite_backup_path: /var/backups/yvy/yvy.db.predeploy
    yvy_install_test_deps: "0"
    c_server_bin: "{{ app_dir }}/backend-lua/yvy-server"
    static_build_dir: "{{ app_dir }}/frontend/build"

  tasks:
    - name: Instalar dependencias de runtime baremetal
      ansible.builtin.apt:
        update_cache: true
        name:
          - git
          - python3
          # python3-venv needed so `python3 -m venv` works on fresh VMs
          # (setup-python-env.sh in setup-lua.sh otherwise fails).
          - python3-venv
          - build-essential
          - pkg-config
          - wget
          - unzip
          - ca-certificates
          - lua5.1
          - liblua5.1-0-dev
          - luarocks
          - libsqlite3-dev
          - libssl-dev
          - libexpat1-dev
          - redis-server
          - sqlite3
          - curl
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Garantir Redis ativo
      ansible.builtin.systemd:
        name: redis-server
        state: started
        enabled: true

    - name: Garantir swap para VM 1GB
      ansible.builtin.shell:
        cmd: |
          swapon --show | grep -q /swapfile || {
            fallocate -l 2G /swapfile &&
            chmod 600 /swapfile &&
            mkswap /swapfile &&
            swapon /swapfile &&
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          }
      changed_when: false

    - name: Criar diretorio para ACME challenges
      ansible.builtin.file:
        path: /var/www/certbot
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Verificar se nvm esta instalado
      ansible.builtin.stat:
        path: "{{ nvm_dir }}/nvm.sh"
      register: nvm_installed

    - name: Instalar nvm
      when: not nvm_installed.stat.exists
      ansible.builtin.shell:
        cmd: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
        args:
          creates: "{{ nvm_dir }}/nvm.sh"
      become_user: "{{ yvy_user }}"

    - name: Instalar Node {{ node_version }} via nvm
      ansible.builtin.shell:
        cmd: |
          export NVM_DIR="{{ nvm_dir }}"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          nvm install {{ node_version }}
          nvm alias default {{ node_version }}
        executable: /bin/bash
      become_user: "{{ yvy_user }}"
      register: node_install
      # nvm prints "already installed" to stderr when the version is present.
      changed_when: "'already installed' not in node_install.stderr"

    - name: Obter caminho do Node bin
      ansible.builtin.shell:
        cmd: |
          export NVM_DIR="{{ nvm_dir }}"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          which node
        executable: /bin/bash
      become_user: "{{ yvy_user }}"
      register: node_path_result
      changed_when: false

    - name: Criar diretorio da aplicacao
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ yvy_user }}"
        group: "{{ yvy_group }}"
        mode: '0755'

    - name: Verificar ownership do diretorio da aplicacao
      ansible.builtin.stat:
        path: "{{ app_dir }}"
      register: app_dir_stat

    # The git checkout runs as {{ yvy_user }}, so after the first deploy the
    # tree is already owned correctly. Only recurse when it is not, to avoid
    # walking node_modules (thousands of files) on every deploy.
    - name: Corrigir ownership do diretorio da aplicacao (apenas se necessario)
      when: >
        app_dir_stat.stat.pw_name != yvy_user or
        app_dir_stat.stat.gr_name != yvy_group
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ yvy_user }}"
        group: "{{ yvy_group }}"
        recurse: yes

    - name: Parar backend antes de preservar banco SQLite
      ansible.builtin.systemd:
        name: yvy-backend
        state: stopped
      ignore_errors: true

    - name: Parar frontend antes do checkout
      ansible.builtin.systemd:
        name: yvy-frontend
        state: stopped
      ignore_errors: true

    - name: Verificar banco SQLite existente antes do git checkout
      ansible.builtin.stat:
        path: "{{ app_dir }}/backend-lua/data/yvy.db"
      register: existing_sqlite_db

    - name: Criar diretorio de backup SQLite
      ansible.builtin.file:
        path: "{{ sqlite_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Checkpoint WAL do SQLite existente antes do backup
      when: existing_sqlite_db.stat.exists
      ansible.builtin.command:
        cmd: sqlite3 {{ app_dir }}/backend-lua/data/yvy.db "PRAGMA wal_checkpoint(TRUNCATE);"
      become_user: "{{ yvy_user }}"

    - name: Preservar banco SQLite existente antes do git checkout
      when: existing_sqlite_db.stat.exists
      ansible.builtin.copy:
        src: "{{ app_dir }}/backend-lua/data/yvy.db"
        dest: "{{ sqlite_backup_path }}"
        remote_src: true
        owner: "{{ yvy_user }}"
        group: "{{ yvy_group }}"
        mode: '0644'

    - name: Clonar repositório Yvy
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes
      become_user: "{{ yvy_user }}"

    - name: Garantir diretorio de dados do backend Lua
      ansible.builtin.file:
        path: "{{ app_dir }}/backend-lua/data"
        state: directory
        owner: "{{ yvy_user }}"
        group: "{{ yvy_group }}"
        mode: '0755'

    - name: Restaurar banco SQLite preservado apos git checkout
      when: existing_sqlite_db.stat.exists
      ansible.builtin.copy:
        src: "{{ sqlite_backup_path }}"
        dest: "{{ app_dir }}/backend-lua/data/yvy.db"
        remote_src: true
        owner: "{{ yvy_user }}"
        group: "{{ yvy_group }}"
        mode: '0644'

    - name: Gerar secrets se .env não existir
      ansible.builtin.command:
        cmd: bash scripts/deploy/generate-secrets.sh
        chdir: "{{ app_dir }}"
      become_user: "{{ yvy_user }}"
      args:
        creates: "{{ app_dir }}/.env"

    - name: Configurar CORS_ORIGINS no .env
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^CORS_ORIGINS=.*"
        line: "CORS_ORIGINS=http://{{ ansible_host }}:5001,http://localhost:5001"
        create: true
      become_user: "{{ yvy_user }}"

    - name: Rodar setup Lua
      ansible.builtin.command:
        cmd: bash scripts/dev/setup-lua.sh
        chdir: "{{ app_dir }}"
      environment:
        YVY_INSTALL_TEST_DEPS: "{{ yvy_install_test_deps }}"
      become_user: "{{ yvy_user }}"

    - block:
        - name: Migrar SQLite JSONB explicitamente
          ansible.builtin.command:
            cmd: lua5.1 app/migrate.lua
            chdir: "{{ app_dir }}/backend-lua"
          environment:
            SQLITE_PATH: "{{ app_dir }}/backend-lua/data/yvy.db"
          become_user: "{{ yvy_user }}"
          async: 5400
          poll: 10

        - name: Validar migracao SQLite JSONB e ingerir lookups
          ansible.builtin.shell:
            cmd: |
              cd {{ app_dir }}/backend-lua
              SQLITE_PATH={{ app_dir }}/backend-lua/data/yvy.db lua5.1 -e 'package.path="./?.lua;./?/init.lua;"..package.path; require("app.env"); local db=require("app.db"); db.init_db(); require("app.lookups.biome_lookup").load_biomes(); require("app.lookups.indigenous_lands_lookup").load_indigenous_lands(); require("app.lookups.conservation_units_lookup").load_conservation_units(); db.optimize_db(); print("sqlite jsonb migration ok")'
            executable: /bin/bash
          become_user: "{{ yvy_user }}"

      rescue:
        - name: Restaurar banco SQLite preservado apos falha de migracao
          when: existing_sqlite_db.stat.exists
          ansible.builtin.copy:
            src: "{{ sqlite_backup_path }}"
            dest: "{{ app_dir }}/backend-lua/data/yvy.db"
            remote_src: true
            owner: "{{ yvy_user }}"
            group: "{{ yvy_group }}"
            mode: '0644'

        - name: Abortar deploy apos falha de migracao SQLite
          ansible.builtin.fail:
            msg: "Migração JSONB falhou; o backup SQLite foi restaurado."

    # ── Frontend build cache ──────────────────────────────────────────────
    # npm ci (~2m) and react-scripts build (~3m) are the two slowest steps on
    # the 1GB VM. They only need to run when the frontend actually changed:
    #   * npm ci is skipped when node_modules exists and package-lock.json is
    #     unchanged (checksum marker).
    #   * npm run build is skipped when frontend/ is unchanged since the last
    #     successful build (commit-SHA marker) and build/ is present.
    # Markers live in {{ sqlite_backup_dir }} (outside the repo) so they
    # survive the `git checkout` (force reset) and never pollute the tree.
    - name: Verificar package-lock.json do frontend
      ansible.builtin.stat:
        path: "{{ app_dir }}/frontend/package-lock.json"
      register: frontend_package_lock

    - name: Verificar node_modules do frontend
      ansible.builtin.stat:
        path: "{{ app_dir }}/frontend/node_modules"
      register: frontend_node_modules

    - name: Ler checksum das dependencias instaladas
      ansible.builtin.shell:
        cmd: cat {{ sqlite_backup_dir }}/frontend-lock-sha 2>/dev/null || true
      register: frontend_installed_lock_sha
      changed_when: false

    - name: Obter commit atual do repositorio
      ansible.builtin.shell:
        cmd: git -C {{ app_dir }} rev-parse HEAD
      become_user: "{{ yvy_user }}"
      register: repo_head
      changed_when: false

    - name: Ler commit do ultimo build frontend
      ansible.builtin.shell:
        cmd: cat {{ sqlite_backup_dir }}/frontend-build-sha 2>/dev/null || true
      register: frontend_last_build_sha
      changed_when: false

    - name: Determinar se o frontend precisa ser reconstruido
      ansible.builtin.shell:
        cmd: |
          last="{{ frontend_last_build_sha.stdout }}"
          if [ -n "$last" ] \
            && [ -d "{{ app_dir }}/frontend/build" ] \
            && git -C {{ app_dir }} diff --quiet "$last" HEAD -- frontend/ 2>/dev/null; then
            echo skip
          else
            echo build
          fi
        executable: /bin/bash
      become_user: "{{ yvy_user }}"
      register: frontend_build_needed
      changed_when: false

    - name: Instalar dependencias frontend (se necessario)
      when: >
        not frontend_node_modules.stat.exists or
        frontend_package_lock.stat.checksum != frontend_installed_lock_sha.stdout
      ansible.builtin.shell:
        cmd: |
          export NVM_DIR="{{ nvm_dir }}"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          cd {{ app_dir }}/frontend
          npm ci
        executable: /bin/bash
      become_user: "{{ yvy_user }}"
      register: frontend_npm_ci

    - name: Gravar checksum das dependencias instaladas
      ansible.builtin.shell:
        cmd: echo "{{ frontend_package_lock.stat.checksum }}" > {{ sqlite_backup_dir }}/frontend-lock-sha
      when: frontend_npm_ci.changed is defined and frontend_npm_ci.changed

    - name: Build frontend (se mudou desde o ultimo deploy)
      when: frontend_build_needed.stdout == 'build'
      ansible.builtin.shell:
        cmd: |
          export NVM_DIR="{{ nvm_dir }}"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          cd {{ app_dir }}/frontend
          npm run build
        executable: /bin/bash
      become_user: "{{ yvy_user }}"
      register: frontend_build

    - name: Gravar commit do build frontend
      ansible.builtin.shell:
        cmd: echo "{{ repo_head.stdout }}" > {{ sqlite_backup_dir }}/frontend-build-sha
      when: frontend_build.changed is defined and frontend_build.changed

    - name: Compilar servidor C frontend (yvy-server)
      ansible.builtin.shell:
        cmd: |
          cd {{ app_dir }}/backend-lua
          make clean
          make
        executable: /bin/bash
      become_user: "{{ yvy_user }}"

    - name: Criar unidade systemd do backend
      ansible.builtin.template:
        src: yvy-backend.service.j2
        dest: /etc/systemd/system/yvy-backend.service
        owner: root
        group: root
        mode: '0644'

    - name: Criar unidade systemd do frontend
      ansible.builtin.template:
        src: yvy-frontend.service.j2
        dest: /etc/systemd/system/yvy-frontend.service
        owner: root
        group: root
        mode: '0644'

    - name: Criar unidade systemd do check PRODES (Inc 5)
      ansible.builtin.template:
        src: yvy-prodes-check.service.j2
        dest: /etc/systemd/system/yvy-prodes-check.service
        owner: root
        group: root
        mode: '0644'

    - name: Criar timer systemd do check PRODES (Inc 5)
      ansible.builtin.template:
        src: yvy-prodes-check.timer.j2
        dest: /etc/systemd/system/yvy-prodes-check.timer
        owner: root
        group: root
        mode: '0644'

    - name: Criar unidade systemd do DETER daily (Inc 6)
      ansible.builtin.template:
        src: yvy-deter-daily.service.j2
        dest: /etc/systemd/system/yvy-deter-daily.service
        owner: root
        group: root
        mode: '0644'

    - name: Criar timer systemd do DETER daily (Inc 6)
      ansible.builtin.template:
        src: yvy-deter-daily.timer.j2
        dest: /etc/systemd/system/yvy-deter-daily.timer
        owner: root
        group: root
        mode: '0644'

    - name: Recarregar systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Ativar e iniciar backend
      ansible.builtin.systemd:
        name: yvy-backend
        state: restarted
        enabled: true

    - name: Ativar e iniciar frontend
      ansible.builtin.systemd:
        name: yvy-frontend
        state: restarted
        enabled: true

    - name: Ativar timer do check PRODES (Inc 5)
      ansible.builtin.systemd:
        name: yvy-prodes-check.timer
        state: started
        enabled: true

    - name: Ativar timer do DETER daily (Inc 6)
      ansible.builtin.systemd:
        name: yvy-deter-daily.timer
        state: started
        enabled: true

    - name: Criar unidade systemd do risk monitor (Inc 6)
      ansible.builtin.template:
        src: yvy-risk-monitor.service.j2
        dest: /etc/systemd/system/yvy-risk-monitor.service
        owner: root
        group: root
        mode: '0644'

    - name: Criar timer systemd do risk monitor (Inc 6)
      ansible.builtin.template:
        src: yvy-risk-monitor.timer.j2
        dest: /etc/systemd/system/yvy-risk-monitor.timer
        owner: root
        group: root
        mode: '0644'

    - name: Ativar timer do risk monitor (Inc 6)
      ansible.builtin.systemd:
        name: yvy-risk-monitor.timer
        state: started
        enabled: true

    - name: Criar unidade systemd do embargo (Inc 2)
      ansible.builtin.template:
        src: yvy-embargo.service.j2
        dest: /etc/systemd/system/yvy-embargo.service
        owner: root
        group: root
        mode: '0644'

    - name: Criar timer systemd do embargo (Inc 2)
      ansible.builtin.template:
        src: yvy-embargo.timer.j2
        dest: /etc/systemd/system/yvy-embargo.timer
        owner: root
        group: root
        mode: '0644'

    - name: Ativar timer do embargo (Inc 2)
      ansible.builtin.systemd:
        name: yvy-embargo.timer
        state: started
        enabled: true

    - name: Criar unidade systemd do sinaflor (Inc 3)
      ansible.builtin.template:
        src: yvy-sinaflor.service.j2
        dest: /etc/systemd/system/yvy-sinaflor.service
        owner: root
        group: root
        mode: '0644'

    - name: Criar timer systemd do sinaflor (Inc 3)
      ansible.builtin.template:
        src: yvy-sinaflor.timer.j2
        dest: /etc/systemd/system/yvy-sinaflor.timer
        owner: root
        group: root
        mode: '0644'

    - name: Ativar timer do sinaflor (Inc 3)
      ansible.builtin.systemd:
        name: yvy-sinaflor.timer
        state: started
        enabled: true

    - name: Criar unidade systemd do area efetiva (fixup Inc 3)
      ansible.builtin.template:
        src: yvy-area-efetiva.service.j2
        dest: /etc/systemd/system/yvy-area-efetiva.service
        owner: root
        group: root
        mode: '0644'

    - name: Criar timer systemd do area efetiva (fixup Inc 3)
      ansible.builtin.template:
        src: yvy-area-efetiva.timer.j2
        dest: /etc/systemd/system/yvy-area-efetiva.timer
        owner: root
        group: root
        mode: '0644'

    - name: Ativar timer do area efetiva (fixup Inc 3)
      ansible.builtin.systemd:
        name: yvy-area-efetiva.timer
        state: started
        enabled: true

    - name: Criar unidade systemd do aux layers (Inc 4)
      ansible.builtin.template:
        src: yvy-aux-layers.service.j2
        dest: /etc/systemd/system/yvy-aux-layers.service
        owner: root
        group: root
        mode: '0644'

    - name: Criar timer systemd do aux layers (Inc 4)
      ansible.builtin.template:
        src: yvy-aux-layers.timer.j2
        dest: /etc/systemd/system/yvy-aux-layers.timer
        owner: root
        group: root
        mode: '0644'

    - name: Ativar timer do aux layers (Inc 4)
      ansible.builtin.systemd:
        name: yvy-aux-layers.timer
        state: started
        enabled: true

    - name: Aguardar backend ficar saudável
      ansible.builtin.uri:
        url: http://localhost:5000/health
        status_code: 200
      register: backend_health
      until: backend_health.status == 200
      retries: 30
      delay: 5

    - name: Verificar health do frontend
      ansible.builtin.uri:
        url: http://localhost:5001/
        status_code: 200
      register: frontend_health
      until: frontend_health.status == 200
      retries: 15
      delay: 5

    - name: Obter API_KEY do .env para nginx
      ansible.builtin.shell:
        cmd: grep '^API_KEY=' {{ app_dir }}/.env | cut -d= -f2
      register: api_key_result
      changed_when: false

    - name: Descobrir linhagem do certificado SSL existente
      ansible.builtin.shell: |
        ls -d /etc/letsencrypt/live/{{ domain }}* 2>/dev/null | sort | tail -1 || true
      register: ssl_lineage
      changed_when: false

    - name: Definir diretório live do certificado SSL
      ansible.builtin.set_fact:
        # Certbot may use a suffixed lineage (e.g. yvy.app.br-0001) if the
        # original (yvy.app.br) had a broken www domain. Fall back to the base
        # path on fresh installs.
        ssl_live_dir: "{{ ssl_lineage.stdout if ssl_lineage.stdout else '/etc/letsencrypt/live/' ~ domain }}"

    - name: Deploy nginx config (HTTPS with HTTP redirect)
      vars:
        api_key: "{{ api_key_result.stdout }}"
      ansible.builtin.template:
        src: yvy-nginx.conf.j2
        dest: /etc/nginx/sites-available/yvy
        owner: root
        group: root
        mode: '0644'
      notify: reload nginx

    - name: Habilitar site nginx
      ansible.builtin.file:
        src: /etc/nginx/sites-available/yvy
        dest: /etc/nginx/sites-enabled/yvy
        state: link
      notify: reload nginx

    - name: Remover configs obsoletas do nginx
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/sites-enabled/default
        - /etc/nginx/sites-enabled/yvy-temp
        - /etc/nginx/sites-available/yvy-temp
        - /etc/nginx/sites-available/yvy-ssl
      notify: reload nginx

    - name: Verificar certificado SSL existe
      ansible.builtin.stat:
        path: "{{ ssl_live_dir }}/fullchain.pem"
      register: ssl_cert

    - name: Solicitar certificado SSL Let's Encrypt (se nao existir)
      # NOTE: do NOT request www.{{ domain }} — it has no DNS record and will
      # fail the ACME challenge (and trigger certbot's --expand prompt).
      when: not ssl_cert.stat.exists
      ansible.builtin.shell:
        cmd: |
          certbot certonly --webroot \
            --webroot-path=/var/www/certbot \
            --email "{{ certbot_email }}" \
            --agree-tos \
            --no-eff-email \
            --non-interactive \
            -d "{{ domain }}"
      ignore_errors: true
      register: cert_result
      notify: reload nginx

    - name: Configurar renew automático do SSL
      ansible.builtin.copy:
        dest: /etc/cron.d/certbot-renew
        content: |
          # webroot renewal, twice monthly. Does NOT let certbot modify nginx.
          0 3 1,15 * * root certbot renew --quiet --webroot -w /var/www/certbot --deploy-hook "systemctl reload nginx"
        owner: root
        group: root
        mode: '0644'

    - name: Testar backend health
      ansible.builtin.uri:
        url: "http://localhost:5000/health"
        status_code: 200
      register: backend_health_check
      until: backend_health_check.status == 200
      retries: 5
      delay: 5

    - name: Testar frontend via nginx HTTPS
      ansible.builtin.uri:
        url: "https://{{ domain }}/"
        status_code: 200
        validate_certs: false
      register: frontend_health_check
      until: frontend_health_check.status == 200
      retries: 5
      delay: 5

    - name: Mostrar URL de acesso
      ansible.builtin.debug:
        msg: |
          ✅ Yvy disponível em: https://{{ domain }}
          Backend health: https://{{ domain }}/health
          API: https://{{ domain }}/api/

  handlers:
    - name: reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
